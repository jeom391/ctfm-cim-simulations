[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfm-contracts"
version = "1.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["jsonschema==4.26.0", "pydantic>=2.11,<3"]

[tool.setuptools]
include-package-data = false
packages = ["ctfm_contracts"]
package-dir = { ctfm_contracts = "." }

[tool.setuptools.package-data]
ctfm_contracts = ["schemas/*.json"]
